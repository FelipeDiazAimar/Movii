name: API CI

on:
  push:
    paths:
      - "gestion-envios/services/api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "gestion-envios/services/api/**"
      - ".github/workflows/api-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestion-envios/services/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: movii_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d movii_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/movii_test?sslmode=disable
      JWT_SECRET: ci-secret-de-pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Vet
        run: go vet ./...
      - name: Aplicar migraciones
        run: go run ./cmd/migrate up
      - name: Test
        run: go test ./... -v -p 1
