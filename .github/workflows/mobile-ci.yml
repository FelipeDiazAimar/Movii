name: Mobile CI

on:
  push:
    paths:
      - "gestion-envios/apps/mobile/**"
  pull_request:
    paths:
      - "gestion-envios/apps/mobile/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gestion-envios/apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: gestion-envios/apps/mobile/package-lock.json
      # npm (como el Dockerfile y Vercel): package-lock.json es el lockfile de la app.
      - name: Instalar dependencias
        run: npm ci
      - name: Chequeo de tipos
        run: npm run check
      - name: Test
        run: npm test
      - name: Build de la PWA (/app)
        run: npx expo export -p web --output-dir dist-web
        env:
          EXPO_BASE_URL: /app
          EXPO_PUBLIC_API_URL: /api
          CI: "1"
