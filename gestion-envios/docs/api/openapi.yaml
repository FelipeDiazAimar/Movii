openapi: 3.0.3
info:
  title: Movii API
  version: "1.0.0"
  description: |
    API REST del sistema de gestión de envíos Movii. Expone autenticación,
    gestión de usuarios/repartidores, alta y consulta de envíos, gestión de
    rutas de reparto, asignación de envíos a rutas y el listado de envíos
    del día para repartidores.

    Esta especificación fue generada leyendo directamente el código fuente
    de los handlers, structs de dominio y middleware en
    `services/api/internal/`, así que refleja el contrato real de la API
    (campos, roles requeridos y códigos de error) y no un diseño aspiracional.

    ### Autenticación
    Todos los endpoints salvo `POST /auth/register`, `POST /auth/login` y
    `GET /health` requieren un JWT (HS256) en el header
    `Authorization: Bearer <token>`. El token se obtiene en `POST /auth/login`.
    Los demás `/auth/*` (código de verificación, primer acceso, Google y
    `GET /auth/config`) también son públicos. El token de primer acceso (T1,
    claim `scope`) no sirve para ningún endpoint protegido: responden 403
    `primer_acceso_pendiente`.

    ### Roles
    Algunos endpoints además exigen que el rol del usuario autenticado
    (`operador`, `repartidor` o `admin`) esté entre los permitidos. El
    rol requerido de cada endpoint protegido está documentado en su
    `description` y en la extensión `x-required-role`.
servers:
  - url: http://localhost:8080
    description: Desarrollo local

tags:
  - name: auth
    description: Registro y login
  - name: usuarios
    description: Listado de usuarios y repartidores
  - name: envios
    description: Alta y consulta de envíos
  - name: rutas
    description: Gestión de rutas y asignación de envíos
  - name: repartidor
    description: Vista del repartidor autenticado
  - name: tracking
    description: Consulta pública por código de guía (sin login)
  - name: analitica
    description: Panel de operaciones, mapa de ruta y reportes (Sprint 3)
  - name: health
    description: Chequeo de disponibilidad

paths:
  /health:
    get:
      tags: [health]
      summary: Chequeo de disponibilidad
      description: Endpoint público, sin autenticación.
      operationId: health
      security: []
      responses:
        "200":
          description: El servicio está disponible.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /auth/register:
    post:
      tags: [auth]
      summary: Registrar un usuario nuevo
      description: Endpoint público, sin autenticación.
      operationId: registerUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              nombre: Lucía Fernández
              email: lucia.fernandez@movii.com.ar
              password: "ContraseñaSegura123"
              rol: operador
      responses:
        "201":
          description: Usuario creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioCreado"
              example:
                id: 3f2b1a10-9e4e-4c2a-8f0a-1a2b3c4d5e6f
                nombre: Lucía Fernández
                email: lucia.fernandez@movii.com.ar
                rol: operador
        "400":
          description: >
            Body no es JSON válido (`body_invalido`), el email no tiene
            formato válido (`email_invalido`), o el rol no es
            operador/repartidor/admin (`rol_invalido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                email_invalido:
                  value:
                    error:
                      code: email_invalido
                      message: el email no tiene un formato válido
                rol_invalido:
                  value:
                    error:
                      code: rol_invalido
                      message: el rol debe ser operador, repartidor o admin
        "409":
          description: Ya existe un usuario con ese email (`email_en_uso`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: email_en_uso
                  message: ya existe un usuario con ese email
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /auth/login:
    post:
      x-sprint3: "Con celular cargado (y WhatsApp disponible) responde DesafioLogin en vez del token; el token sale de /auth/login/verificar."
      tags: [auth]
      summary: Iniciar sesión
      description: Endpoint público, sin autenticación. Devuelve un JWT válido por 24 horas.
      operationId: loginUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: lucia.fernandez@movii.com.ar
              password: "ContraseñaSegura123"
      responses:
        "200":
          description: Login correcto.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LoginResponse"
                  - $ref: "#/components/schemas/DesafioLogin"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjJiMWExMCJ9.abc123
        "400":
          description: Body no es JSON válido (`body_invalido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: >
            Email o contraseña incorrectos, o el usuario está dado de baja
            (`credenciales_invalidas`). La API no distingue entre estos casos
            a propósito, para no revelar qué emails están registrados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: credenciales_invalidas
                  message: email o contraseña incorrectos
        "428":
          description: >
            Primer acceso pendiente (T1): el usuario fue dado de alta por un admin
            y tiene que elegir una contraseña nueva y validar un código. `token`
            vence a los 15 minutos y solo sirve para
            `POST /auth/primer-acceso/cambiar-password`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrimerAccesoRequerido" }
        "429": { description: "Ya se pidió un código hace menos de un minuto (`esperar_reenvio`) o más de 3 en 15 minutos (`demasiados_pedidos`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /auth/primer-acceso/cambiar-password:
    post:
      tags: [auth]
      summary: Primer acceso - elegir contraseña nueva y recibir el código (T1)
      description: |
        Valida el `token` del 428 de `POST /auth/login`, aplica las reglas (8+
        caracteres, una mayúscula y un número) y guarda la contraseña. Después
        manda un código de 6 dígitos por WhatsApp (si el usuario tiene celular y
        WhatsApp está disponible) o por mail (Resend). `must_change_password`
        sigue en true hasta validar el código en `/auth/primer-acceso/verificar`.
      operationId: cambiarPasswordPrimerAcceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, nueva_password, token]
              properties:
                user_id: { type: string }
                nueva_password: { type: string, example: "NuevaClave1" }
                token: { type: string, description: "El `token` del 428." }
      responses:
        "200":
          description: Contraseña guardada; el código ya salió.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesafioLogin" }
        "400": { description: "No cumple las reglas (`password_debil`) o body inválido.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: "Token inválido, vencido, de otro usuario o el primer acceso ya se completó (`primer_acceso_invalido`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "429": { description: "`esperar_reenvio` (1 código por minuto) o `demasiados_pedidos`.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "502": { description: "No se pudo enviar el código (`envio_codigo_error`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /auth/primer-acceso/verificar:
    post:
      tags: [auth]
      summary: Primer acceso - validar el código y entrar (T1)
      description: |
        Igual que `POST /auth/login/verificar`: si el código es correcto baja
        `must_change_password` y devuelve el JWT de sesión. Código vencido o
        tercer intento fallido → `codigo_vencido` (pedir otro con `/reenviar`).
      operationId: verificarPrimerAcceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desafio_id, codigo]
              properties:
                desafio_id: { type: string }
                codigo: { type: string, example: "123456" }
      responses:
        "200":
          description: Primer acceso completo, sesión iniciada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { description: "`codigo_invalido` (incorrecto) o `codigo_vencido` (vencido, usado o sin intentos).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /auth/primer-acceso/reenviar:
    post:
      tags: [auth]
      summary: Primer acceso - reenviar el código (invalida el anterior)
      operationId: reenviarPrimerAcceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desafio_id]
              properties:
                desafio_id: { type: string }
      responses:
        "200":
          description: Código nuevo enviado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesafioLogin" }
        "401": { description: "El desafío no existe (`codigo_invalido`): volver a iniciar sesión.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "429": { description: "`esperar_reenvio` (1 código por minuto) o `demasiados_pedidos` (3 cada 15 minutos).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "502": { description: "No se pudo enviar el código (`envio_codigo_error`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /auth/config:
    get:
      tags: [auth]
      summary: Métodos de login disponibles (feature flag del botón de Google, T2)
      operationId: configAuth
      security: []
      responses:
        "200":
          description: "`google` es true solo con GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET y GOOGLE_CALLBACK_URL configuradas."
          content:
            application/json:
              schema:
                type: object
                properties:
                  google: { type: boolean }

  /auth/google:
    get:
      tags: [auth]
      summary: Iniciar login con Google (T2)
      description: |
        Redirige (302) a Google con scopes `openid email profile` y un `state`
        firmado (HMAC) cuyo nonce también va en la cookie HttpOnly
        `movii_google_state` (anti-CSRF). La web navega directo a esta URL; la app
        móvil la abre con `redirect_uri=movii://...` (`exp://` solo fuera de producción).
        Sin Google configurado redirige a `/login?error=google_no_configurado`.
      operationId: loginGoogle
      security: []
      parameters:
        - { name: redirect_uri, in: query, required: false, schema: { type: string }, description: "Solo app móvil: adónde volver (movii://...)." }
      responses:
        "302": { description: Redirección a Google. }
        "400": { description: "`redirect_uri` no permitido (`redirect_invalido`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /auth/google/callback:
    get:
      tags: [auth]
      summary: Vuelta de Google (T2)
      description: |
        Valida `state` + cookie, canjea `code` por el id_token (valida `iss`, `aud`,
        `exp` y `email_verified`), busca el usuario por `google_id` o email (lo
        vincula y conserva el rol) o crea uno nuevo con rol `operador`
        (`auth_provider=google`). Redirige a la web (`PUBLIC_WEB_URL`) o a la app:
          - ok → `/login#token=<jwt>&email=...`
          - primer acceso pendiente → `/primer-acceso#desafio_id=...&canal=...&destino=...&vence_en_segundos=...` (el código ya salió)
          - error → `/login?error=cancelado|google_denied|google_error|email_no_verificado|cuenta_inactiva|google_otra_cuenta|codigo_no_enviado`
        El token va en el fragmento (`#`), que el navegador no manda a ningún servidor.
      operationId: callbackGoogle
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: "`access_denied` si el usuario canceló." }
      responses:
        "302": { description: Redirección a la web o a la app. }

  /users/{id}:
    delete:
      tags: [usuarios]
      summary: Eliminar un usuario
      description: Bloqueado (423) para uno mismo y para el último admin. Solo admin (otro rol recibe 403). Borrado físico.
      operationId: deleteUsuario
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '403': { description: Rol sin permiso }
        '404': { description: No existe }
        '423': { description: Bloqueado por regla de negocio }
  /users:
    get:
      tags: [usuarios]
      summary: Listar usuarios
      description: |
        Requiere autenticación. **Rol requerido: admin.**
      operationId: listUsuarios
      x-required-role: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Usuario"
              example:
                - id: 3f2b1a10-9e4e-4c2a-8f0a-1a2b3c4d5e6f
                  nombre: Lucía Fernández
                  email: lucia.fernandez@movii.com.ar
                  rol: operador
                  activo: true
                - id: 7a1c9d20-1b3e-4f5a-9c0d-2e3f4a5b6c7d
                  nombre: Martín Gómez
                  email: martin.gomez@movii.com.ar
                  rol: repartidor
                  activo: true
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
  /repartidores:
    get:
      tags: [usuarios]
      summary: Listar repartidores (opción mínima)
      description: |
        Lista mínima (solo `id` y `nombre`) que un operador usa para elegir
        repartidor al crear o editar una ruta. A diferencia de `GET /users`
        no expone email, rol ni estado.

        Requiere autenticación. **Rol requerido: operador, admin.**
      operationId: listRepartidores
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de repartidores (id + nombre).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepartidorOption"
              example:
                - id: 7a1c9d20-1b3e-4f5a-9c0d-2e3f4a5b6c7d
                  nombre: Martín Gómez
                - id: 9b2d0e31-2c4f-5a6b-0d1e-3f4a5b6c7d8e
                  nombre: Sofía Ledesma
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios:
    get:
      tags: [envios]
      summary: Listar envíos
      description: |
        Requiere autenticación, cualquier rol.
      operationId: listEnvios
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado del envío.
          schema:
            $ref: "#/components/schemas/EstadoEnvio"
        - name: fecha
          in: query
          required: false
          description: >
            Filtra por fecha (formato YYYY-MM-DD): matchea la fecha de
            creación del envío O su fecha de reprogramación (Sprint 2,
            HU-09). Un reprogramado aparece en los listados de su nueva fecha.
          schema:
            type: string
            example: "2026-09-09"
      responses:
        "200":
          description: Lista de envíos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnvioListItem"
              example:
                - id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                  codigo_guia: MOV-20260909-0001
                  estado: pendiente
                  peso: 3.5
                  tamano: mediano
                  destinatario: Carla Rodríguez
                  direccion: "San Martín 452, San Francisco"
                  fecha_creacion: "2026-09-09T13:20:00Z"
                  ruta_id: null
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: [envios]
      summary: Registrar un envío nuevo
      description: |
        Crea remitente, destinatario y envío. Requiere autenticación.
        **Rol requerido: operador, admin.**
      operationId: createEnvio
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearEnvioRequest"
            example:
              remitente:
                nombre: Depósito Central Movii
                telefono: "3564123456"
                direccion: "Ruta 19 km 3, San Francisco"
              destinatario:
                nombre: Carla Rodríguez
                telefono: "3564654321"
                calle: San Martín
                numero: "452"
                piso_depto: ""
                localidad: San Francisco
                codigo_postal: X2400
              paquete:
                peso: 3.5
                tamano: mediano
                tipo_contenido: ropa
                fragil: false
                urgente: false
      responses:
        "201":
          description: Envío creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvioCreado"
              example:
                id: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                codigo_guia: MOV-20260909-0001
                estado: pendiente
                peso: 3.5
                tamano: mediano
        "400":
          description: >
            Body no es JSON válido (`body_invalido`), o faltan datos
            obligatorios: nombre del destinatario, calle, localidad o peso
            (`campos_obligatorios`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: campos_obligatorios
                  message: faltan datos obligatorios del envío
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}:
    get:
      tags: [envios]
      summary: Obtener el detalle de un envío
      description: |
        Requiere autenticación, cualquier rol. Desde el Sprint 2 incluye
        el historial de eventos, los datos de reprogramación (si aplica) y
        la metadata de la confirmación de entrega con las URLs binarias de
        firma y foto (si aplica).
      operationId: getEnvioById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle del envío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvioDetalle"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: El envío no existe (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: el envío no existe
        "500":
          $ref: "#/components/responses/ErrorInterno"
    delete:
      tags: [envios]
      summary: Eliminar un envío
      description: Solo envíos sin ruta que no estén en camino ni entregados. Solo admin (otro rol recibe 403). Borrado físico.
      operationId: deleteEnvio
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '403': { description: Rol sin permiso }
        '404': { description: No existe }
        '423': { description: Bloqueado por regla de negocio }
  /rutas:
    get:
      tags: [rutas]
      summary: Listar rutas
      description: |
        Requiere autenticación, cualquier rol.
      operationId: listRutas
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          description: Filtra por fecha de la ruta (formato YYYY-MM-DD).
          schema:
            type: string
            example: "2026-09-09"
      responses:
        "200":
          description: Lista de rutas, con la cantidad de envíos asignados a cada una.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RutaConConteo"
              example:
                - id: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
                  nombre: Zona Centro AM
                  zona: Centro
                  fecha: "2026-09-09"
                  estado: planificada
                  repartidor_id: 7a1c9d20-1b3e-4f5a-9c0d-2e3f4a5b6c7d
                  cantidad_envios: 4
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "500":
          $ref: "#/components/responses/ErrorInterno"
    post:
      tags: [rutas]
      summary: Crear una ruta
      description: |
        Requiere autenticación. **Rol requerido: operador, admin.**
      operationId: createRuta
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RutaRequest"
            example:
              nombre: Zona Centro AM
              zona: Centro
              fecha: "2026-09-09"
              repartidor_id: 7a1c9d20-1b3e-4f5a-9c0d-2e3f4a5b6c7d
      responses:
        "201":
          description: Ruta creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruta"
              example:
                id: c1d2e3f4-a5b6-7c8d-9e0f-1a2b3c4d5e6f
                nombre: Zona Centro AM
                zona: Centro
                fecha: "2026-09-09"
                estado: planificada
                repartidor_id: 7a1c9d20-1b3e-4f5a-9c0d-2e3f4a5b6c7d
        "400":
          description: >
            Body no es JSON válido (`body_invalido`), o falta el repartidor
            o la fecha (`campos_obligatorios`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: campos_obligatorios
                  message: faltan el repartidor o la fecha de la ruta
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /rutas/{id}:
    get:
      tags: [rutas]
      summary: Obtener el detalle de una ruta
      description: |
        Requiere autenticación, cualquier rol.
      operationId: getRutaById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle de la ruta con sus envíos y totales.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RutaDetalle"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: La ruta no existe (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: la ruta no existe
        "500":
          $ref: "#/components/responses/ErrorInterno"
    put:
      tags: [rutas]
      summary: Editar una ruta
      description: |
        Solo se puede editar una ruta en estado `planificada`. Requiere
        autenticación. **Rol requerido: operador, admin.**
      operationId: updateRuta
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RutaRequest"
            example:
              nombre: Zona Centro AM (actualizada)
              zona: Centro
              fecha: "2026-09-10"
              repartidor_id: 7a1c9d20-1b3e-4f5a-9c0d-2e3f4a5b6c7d
      responses:
        "200":
          description: Ruta editada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ruta"
        "400":
          description: >
            Body no es JSON válido (`body_invalido`), o falta el repartidor
            o la fecha (`campos_obligatorios`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: La ruta no existe (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >
            La ruta no se puede editar en su estado actual
            (`ruta_no_editable`) — solo se editan rutas planificadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: ruta_no_editable
                  message: la ruta no se puede editar en su estado actual
        "500":
          $ref: "#/components/responses/ErrorInterno"
    delete:
      tags: [rutas]
      summary: Eliminar una ruta
      description: Bloqueada (423) si está en curso; los envíos asignados vuelven a pendiente. Solo admin (otro rol recibe 403). Borrado físico.
      operationId: deleteRuta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Eliminado }
        '403': { description: Rol sin permiso }
        '404': { description: No existe }
        '423': { description: Bloqueado por regla de negocio }
  /rutas/{id}/envios:
    post:
      tags: [rutas]
      summary: Asignar envíos a una ruta
      description: |
        Asigna los envíos dados a la ruta (deben estar en estado
        `pendiente`, y la fecha de la ruta no debe haber vencido). Si algún
        envío no está disponible no se asigna ninguno. Requiere
        autenticación. **Rol requerido: operador, admin.**
      operationId: asignarEnviosARuta
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la ruta.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsignarEnviosRequest"
            example:
              envio_ids:
                - 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
                - 2b3c4d5e-6f7a-8b9c-0d1e-2f3a4b5c6d7e
      responses:
        "200":
          description: Cantidad de envíos que quedaron asignados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsignarEnviosResponse"
              example:
                asignados: 2
        "400":
          description: >
            Body no es JSON válido (`body_invalido`), o la fecha de la ruta
            ya pasó (`fecha_vencida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                fecha_vencida:
                  value:
                    error:
                      code: fecha_vencida
                      message: la fecha de la ruta ya pasó
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: La ruta no existe (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >
            Uno o más envíos no están pendientes
            (`envio_no_disponible`), o la recomendación es `no_conviene` y
            falta `forzar: true` (`no_conviene`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: envio_no_disponible
                  message: uno o más envíos no están pendientes
        "422":
          description: >
            La dirección de un envío no se pudo ubicar (`direccion_invalida`);
            no se asigna ninguno.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /rutas/{id}/recomendar:
    post:
      tags: [rutas]
      summary: Validar la dirección de un envío y recomendar si conviene a la ruta
      description: |
        Geocodifica la dirección del envío y las paradas de la ruta y calcula
        el desvío (`extra_km`, `desvio_pct`). Reglas (umbrales configurables
        con `RECOMIENDA_UMBRAL_OK_KM` / `RECOMIENDA_UMBRAL_NO_KM`):
        `no_conviene` si extra > umbral NO (5 km), o desvío > 40 %;
        `conviene` si extra < umbral OK (2 km) o desvío < 15 %; si no,
        `dudoso`. Si el servicio de mapas no responde devuelve
        `sin_recomendacion` (se puede asignar igual). Dirección con confianza
        menor a 0.6 o inexistente: `422 direccion_invalida`.
        **Rol requerido: operador, admin.**
      operationId: recomendarEnvioEnRuta
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la ruta.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecomendarRequest"
      responses:
        "200":
          description: Recomendación.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recomendacion"
              example:
                extra_km: 1.2
                desvio_pct: 8
                recomendacion: conviene
                motivo: queda cerca de la ruta (+1.2 km, +8%)
        "400":
          description: Body inválido o sin `envio_id` (`body_invalido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: La ruta o el envío no existen (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: La dirección del envío no se pudo ubicar (`direccion_invalida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /rutas/{id}/envios/{envioId}:
    delete:
      tags: [rutas]
      summary: Desasignar un envío de una ruta
      description: |
        Solo se puede desasignar un envío de una ruta en estado
        `planificada`. El envío vuelve al estado `pendiente`. Requiere
        autenticación. **Rol requerido: operador, admin.**
      operationId: desasignarEnvioDeRuta
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la ruta.
          schema:
            type: string
        - name: envioId
          in: path
          required: true
          description: ID del envío.
          schema:
            type: string
      responses:
        "200":
          description: Envío desasignado; queda en estado pendiente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: pendiente
                required: [estado]
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: La ruta o el envío no existen (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: la ruta o el envío no existen
        "409":
          description: >
            La ruta no se puede editar en su estado actual
            (`ruta_no_editable`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /repartidor/envios-del-dia:
    get:
      tags: [repartidor]
      summary: Envíos del día del repartidor autenticado
      description: |
        Devuelve los envíos de hoy (fecha del servidor, UTC) del repartidor
        que hizo la request, agrupados por ruta, con contadores por estado.
        El repartidor se identifica por el JWT, nunca por un parámetro de la
        request. Requiere autenticación. **Rol requerido: repartidor.**
      operationId: enviosDelDiaRepartidor
      x-required-role: [repartidor]
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          description: Filtra por estado del envío.
          schema:
            $ref: "#/components/schemas/EstadoEnvio"
      responses:
        "200":
          description: Resumen del día del repartidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumenDelDia"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /repartidor/perfil:
    get:
      tags: [repartidor]
      summary: Perfil del repartidor autenticado
      description: |
        Cuenta (email, celular enmascarado, desde cuándo), vehículo de la ruta
        de hoy con su carga, entregas de los últimos 7 días, histórico y
        motivos de fallo. Siempre del usuario del JWT. **Rol requerido: repartidor.**
      operationId: perfilRepartidor
      x-required-role: [repartidor]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del repartidor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilRepartidor"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}/estado:
    put:
      tags: [envios]
      summary: Cambiar el estado de un envío (HU-06)
      description: |
        Transiciones permitidas por este endpoint: `asignado` ⇄ `en_camino`.
        A `entregado` solo se llega por confirmación (`POST .../confirmacion`,
        HU-08) y a `no_entregado` solo por incidencia (`POST .../incidencia`,
        HU-07): pedirlos acá responde 409 e indica el endpoint correcto.
        Cada cambio válido registra un evento en el historial.
        Requiere autenticación. **Roles: repartidor (solo envíos de sus
        rutas), operador, admin.**
      operationId: cambiarEstadoEnvio
      x-required-role: [repartidor, operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarEstadoRequest"
            example:
              estado: en_camino
      responses:
        "200":
          description: Estado actualizado (devuelve el envío).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envio"
        "400":
          description: >
            Body no válido (`body_invalido`) o estado desconocido
            (`estado_invalido`: debe ser `asignado` o `en_camino`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: estado_invalido
                  message: el estado debe ser asignado o en_camino
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: >
            El envío no existe o no pertenece al repartidor (`no_encontrado`;
            404 genérico para no revelar envíos ajenos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: el envío no existe
        "409":
          description: >
            Transición no permitida desde el estado actual
            (`transicion_invalida`). Si se pidió `entregado` o `no_entregado`,
            el mensaje indica usar confirmación o incidencia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: transicion_invalida
                  message: para marcar entregado usá la confirmación de entrega
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}/incidencia:
    post:
      tags: [envios]
      summary: Registrar entrega fallida con motivo (HU-07)
      description: |
        Solo sobre envíos `asignados` o `en_camino`. El envío pasa a
        `no_entregado` y se registra el evento con motivo (y foto si se
        adjunta, reutilizando el mecanismo de HU-08). Todo en una
        transacción: si algo falla, no cambia nada.
        Requiere autenticación. **Roles: repartidor (solo envíos de sus
        rutas), operador, admin.**
      operationId: registrarIncidencia
      x-required-role: [repartidor, operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidenciaRequest"
            example:
              motivo: cliente_ausente
              comentario: "Volver después de las 18"
      responses:
        "200":
          description: Incidencia registrada (devuelve el envío).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envio"
        "400":
          description: >
            Body no válido (`body_invalido`), motivo fuera de la lista
            (`motivo_invalido`), falta el comentario con motivo `otro`
            (`comentario_obligatorio`), o imagen inválida
            (`imagen_invalida`: base64 malformado o no es PNG/JPEG).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: motivo_invalido
                  message: el motivo debe ser uno de la lista cerrada
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: El envío no existe o no pertenece al repartidor (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: el envío no existe
        "409":
          description: El envío no está asignado ni en camino (`transicion_invalida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: transicion_invalida
                  message: solo se puede registrar incidencia sobre un envío asignado o en camino
        "413":
          description: La foto supera los 5 MB (`imagen_muy_grande`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: imagen_muy_grande
                  message: la imagen no puede superar los 5 MB
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}/confirmacion:
    post:
      tags: [envios]
      summary: Confirmar entrega con firma y foto (HU-08)
      description: |
        Solo sobre envíos `asignados` o `en_camino`. Si estaba `asignado`,
        el historial registra el paso por `en_camino`. El envío pasa a
        `entregado` (terminal) y se guarda la evidencia. Firma (PNG) y foto
        (JPEG) viajan en base64 dentro del JSON, máximo 5 MB cada una.
        Requiere autenticación. **Roles: repartidor (solo envíos de sus
        rutas), operador, admin.**
      operationId: confirmarEntrega
      x-required-role: [repartidor, operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmacionRequest"
            example:
              receptor_nombre: Juan Pérez
              receptor_relacion: destinatario
              firma_base64: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
              foto_base64: 
      responses:
        "200":
          description: Entrega confirmada (devuelve el envío).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envio"
        "400":
          description: >
            Body no válido (`body_invalido`), falta receptor/firma/foto
            (`evidencia_incompleta`), relación fuera de la lista
            (`relacion_invalida`), o imagen inválida (`imagen_invalida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: evidencia_incompleta
                  message: la confirmación requiere receptor, firma y foto
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: El envío no existe o no pertenece al repartidor (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: el envío no existe
        "409":
          description: El envío no está asignado ni en camino (`transicion_invalida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: transicion_invalida
                  message: solo se puede confirmar un envío asignado o en camino
        "413":
          description: Firma o foto superan los 5 MB (`imagen_muy_grande`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: imagen_muy_grande
                  message: la imagen no puede superar los 5 MB
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}/confirmacion/firma:
    get:
      tags: [envios]
      summary: Descargar la firma de una entrega confirmada
      description: |
        Devuelve los bytes PNG de la firma (no JSON). Requiere autenticación,
        cualquier rol. 404 si el envío no tiene confirmación.
      operationId: descargarFirma
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagen PNG de la firma.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: El envío no existe o no tiene evidencia (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}/confirmacion/foto:
    get:
      tags: [envios]
      summary: Descargar la foto de una entrega confirmada
      description: |
        Devuelve los bytes JPEG de la foto del paquete (no JSON). Requiere
        autenticación, cualquier rol. 404 si el envío no tiene confirmación.
      operationId: descargarFotoEntrega
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagen JPEG del paquete entregado.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: El envío no existe o no tiene evidencia (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}/eventos/{eventoId}/foto:
    get:
      tags: [envios]
      summary: Descargar la foto de una incidencia
      description: |
        Devuelve los bytes JPEG de la foto de un evento de incidencia (no
        JSON). Requiere autenticación, cualquier rol (el repartidor solo ve
        envíos de sus rutas). 404 si el evento no tiene foto o no pertenece
        al envío.
      operationId: descargarFotoIncidencia
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: eventoId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Imagen JPEG de la incidencia.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "404":
          description: El envío no existe, el evento no tiene foto o no pertenece al envío (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /envios/{id}/reprogramacion:
    post:
      tags: [envios]
      summary: Reprogramar una entrega fallida (HU-09)
      description: |
        Solo sobre envíos `no_entregados`. El envío vuelve a `pendiente`
        para su nueva fecha (aparece en `GET /envios?fecha=` de ese día) y
        se registra el evento. Al asignarse a una ruta, la fecha de la ruta
        manda y se limpian los datos de reprogramación. Notificación al
        cliente: fuera de alcance (decisión Sprint 2).
        Requiere autenticación. **Roles: repartidor (solo envíos de sus
        rutas), operador, admin.**
      operationId: reprogramarEnvio
      x-required-role: [repartidor, operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprogramacionRequest"
            example:
              nueva_fecha: "2026-09-20"
              franja: manana
      responses:
        "200":
          description: Envío reprogramado (devuelve el envío).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envio"
        "400":
          description: >
            Body no válido (`body_invalido`), fecha pasada o con mal formato
            (`fecha_invalida`), o franja fuera de la lista (`franja_invalida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: fecha_invalida
                  message: la nueva fecha no puede ser pasada
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: El envío no existe o no pertenece al repartidor (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: el envío no existe
        "409":
          description: El envío no está en estado no_entregado (`transicion_invalida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: transicion_invalida
                  message: solo se puede reprogramar un envío no entregado
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /tracking/{codigo}:
    get:
      tags: [tracking]
      summary: Tracking público por código de guía (HU-10)
      description: |
        Consulta pública SIN login. Devuelve estado actual, localidad e
        historial con descripciones legibles. **Nunca** expone teléfonos,
        emails, dirección exacta, nombre del repartidor ni datos internos:
        el repo de tracking selecciona solo columnas blancas.
      operationId: trackingPorCodigo
      security: []
      parameters:
        - name: codigo
          in: path
          required: true
          description: Código de guía exacto (formato MOV-YYYYMMDD-XXXX).
          schema:
            type: string
            example: MOV-20260909-0001
      responses:
        "200":
          description: Estado e historial del envío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
              example:
                codigo_guia: MOV-20260909-0001
                estado: en_camino
                localidad: San Francisco
                actualizado_en: "2026-09-09T15:40:00Z"
                historial:
                  - fecha: "2026-09-09T13:20:00Z"
                    descripcion: Envío registrado
                  - fecha: "2026-09-09T14:05:00Z"
                    descripcion: Asignado a ruta de reparto
                  - fecha: "2026-09-09T15:40:00Z"
                    descripcion: En camino
        "404":
          description: Código inexistente (`no_encontrado`, mensaje genérico).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: no se encontró ningún envío con ese código
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /operaciones/dashboard:
    get:
      tags: [analitica]
      summary: Panel de operaciones del día (HU-11)
      description: |
        Métricas, avance de rutas y últimas alertas de un día.

        - Envíos del día: los que están en rutas de esa fecha, más los
          pendientes sin ruta creados o reprogramados para ese día.
        - `porcentaje_efectividad` = entregados / (entregados + no_entregados)
          * 100, con 2 decimales; 0 si no hay intentos resueltos.
        - `completadas` de cada ruta = entregadas + no entregadas.
        - `ultimas_alertas`: hasta 10 incidencias del día, las más nuevas primero.
        - Los arrays nunca son null (vacíos si no hay datos).

        Requiere autenticación. **Rol requerido: operador, admin.**
      operationId: dashboardOperaciones
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          description: Fecha a consultar (YYYY-MM-DD). Por defecto, hoy (UTC).
          schema:
            type: string
            example: "2026-09-09"
      responses:
        "200":
          description: Panel del día.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOperaciones"
        "400":
          description: La fecha no tiene formato YYYY-MM-DD (`fecha_invalida`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: fecha_invalida
                  message: la fecha debe tener formato YYYY-MM-DD
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /rutas/{id}/mapa:
    get:
      tags: [analitica, rutas]
      summary: Paradas de una ruta para el mapa (HU-12)
      description: |
        Paradas de la ruta con su orden y coordenadas. `coordenadas` es null
        si el destino todavía no está geolocalizado.

        Requiere autenticación. **Roles: repartidor (solo sus rutas; una
        ruta ajena responde 404), operador, admin.**
      operationId: getRutaMapa
      x-required-role: [repartidor, operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la ruta.
          schema:
            type: string
      responses:
        "200":
          description: Ruta con sus paradas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RutaMapa"
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "404":
          description: La ruta no existe o no pertenece al repartidor (`no_encontrado`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: no_encontrado
                  message: la ruta no existe
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /reportes/envios:
    get:
      tags: [analitica]
      summary: Reporte de envíos, JSON o CSV (HU-13)
      description: |
        Envíos dados de alta entre `desde` y `hasta` (inclusive, UTC). Con
        `formato=csv` devuelve un archivo UTF-8 con BOM, con
        `Content-Disposition: attachment; filename="reporte_envios_YYYYMMDD_YYYYMMDD.csv"`
        y columnas: Codigo Guia, Fecha Creacion, Remitente, Destinatario,
        Direccion, Localidad, Estado Actual, Ultima Actualizacion, Motivo
        Fallo. Las celdas que empiezan con `=`, `+`, `-` o `@` se prefijan
        con `'` para evitar inyección de fórmulas.

        Requiere autenticación. **Rol requerido: operador, admin.**
      operationId: reporteEnvios
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: desde
          in: query
          required: true
          description: Inicio del período (YYYY-MM-DD).
          schema:
            type: string
            example: "2026-09-01"
        - name: hasta
          in: query
          required: true
          description: Fin del período (YYYY-MM-DD), inclusive. Máximo 366 días desde `desde`.
          schema:
            type: string
            example: "2026-09-30"
        - name: estado
          in: query
          required: false
          description: Filtra por estado actual del envío.
          schema:
            $ref: "#/components/schemas/EstadoEnvio"
        - name: formato
          in: query
          required: false
          description: Formato de salida. Por defecto `json`.
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: Reporte en el formato pedido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteEnvios"
            text/csv:
              schema:
                type: string
        "400":
          description: >
            Período inválido (`periodo_invalido`: desde/hasta obligatorios en
            YYYY-MM-DD, desde <= hasta, máximo 366 días), estado inexistente
            (`estado_invalido`) o formato distinto de json/csv
            (`formato_invalido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                periodo_invalido:
                  value:
                    error:
                      code: periodo_invalido
                      message: desde y hasta son obligatorios (YYYY-MM-DD), desde no puede ser posterior a hasta y el período no puede superar 366 días
                estado_invalido:
                  value:
                    error:
                      code: estado_invalido
                      message: el estado indicado no existe
                formato_invalido:
                  value:
                    error:
                      code: formato_invalido
                      message: el formato debe ser json o csv
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /reportes/repartidores:
    get:
      tags: [analitica]
      summary: Ranking de desempeño de repartidores (HU-14)
      description: |
        Orden: `tasa_efectividad` desc, `entregados` desc, `nombre`.
        `entregados` y `fallidos` son los eventos registrados por el propio
        repartidor en el período; `asignados` = entregados + fallidos +
        envíos aún en curso en sus rutas del período.

        Requiere autenticación. **Rol requerido: operador, admin.**
      operationId: reporteRepartidores
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: desde
          in: query
          required: true
          description: Inicio del período (YYYY-MM-DD).
          schema:
            type: string
            example: "2026-09-01"
        - name: hasta
          in: query
          required: true
          description: Fin del período (YYYY-MM-DD), inclusive. Máximo 366 días desde `desde`.
          schema:
            type: string
            example: "2026-09-30"
      responses:
        "200":
          description: Ranking de repartidores.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankingRepartidores"
        "400":
          description: Período inválido (`periodo_invalido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: periodo_invalido
                  message: desde y hasta son obligatorios (YYYY-MM-DD), desde no puede ser posterior a hasta y el período no puede superar 366 días
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /reportes/incidencias:
    get:
      tags: [analitica]
      summary: Distribución de incidencias por motivo (HU-15)
      description: |
        Los 5 motivos siempre están presentes (incluso con cantidad 0),
        ordenados de mayor a menor cantidad.

        Requiere autenticación. **Rol requerido: operador, admin.**
      operationId: reporteIncidencias
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - name: desde
          in: query
          required: true
          description: Inicio del período (YYYY-MM-DD).
          schema:
            type: string
            example: "2026-09-01"
        - name: hasta
          in: query
          required: true
          description: Fin del período (YYYY-MM-DD), inclusive. Máximo 366 días desde `desde`.
          schema:
            type: string
            example: "2026-09-30"
      responses:
        "200":
          description: Distribución de incidencias.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteIncidencias"
        "400":
          description: Período inválido (`periodo_invalido`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: periodo_invalido
                  message: desde y hasta son obligatorios (YYYY-MM-DD), desde no puede ser posterior a hasta y el período no puede superar 366 días
        "401":
          $ref: "#/components/responses/NoAutenticado"
        "403":
          $ref: "#/components/responses/RolNoAutorizado"
        "500":
          $ref: "#/components/responses/ErrorInterno"

  /operaciones/flota:
    get:
      tags: [flota]
      summary: Flota con la ruta y la carga de cada vehículo en la fecha (HU-18)
      description: |
        Cada vehículo con su telemetría (posición, velocidad, rumbo) y, si tiene ruta
        en la fecha, el repartidor y la carga de esa ruta. **Roles: operador, admin.**
      operationId: listarFlota
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: fecha, in: query, schema: { type: string }, description: "YYYY-MM-DD. Vacía = hoy (hora argentina)." }
      responses:
        "200":
          description: Vehículos ordenados por patente.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehiculo" }
        "400": { description: "Fecha inválida (`fecha_invalida`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }
        "500": { $ref: "#/components/responses/ErrorInterno" }

  /operaciones/flota/{id}:
    get:
      tags: [flota]
      summary: Detalle de un vehículo con sus paquetes y el recorrido por calles (HU-11, HU-18)
      operationId: detalleVehiculo
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: fecha, in: query, schema: { type: string }, description: "YYYY-MM-DD; vacía = hoy." }
      responses:
        "200":
          description: Vehículo, paquetes a bordo y recorrido desde su posición por las paradas pendientes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VehiculoDetalle" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }
        "404": { description: "El vehículo no existe (`no_encontrado`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /operaciones/flota/stream:
    get:
      tags: [flota]
      summary: Posiciones en vivo de la flota (Server-Sent Events)
      description: |
        Stream `text/event-stream`. Cada evento `posicion` trae un PosicionVehiculo en
        `data` (JSON). Al conectarse llega la última posición conocida de cada vehículo.
        Latido cada 20 s. Como EventSource no manda headers, el JWT puede ir en
        `?access_token=`. **Roles: operador, admin, repartidor.**
      operationId: streamFlota
      security:
        - bearerAuth: []
      parameters:
        - { name: access_token, in: query, schema: { type: string }, description: "JWT (alternativa al header Authorization)." }
      responses:
        "200":
          description: Stream de eventos `posicion`.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/NoAutenticado" }

  /vehiculos:
    post:
      tags: [flota]
      summary: Alta de vehículo (HU-18)
      operationId: crearVehiculo
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehiculoRequest" }
      responses:
        "201":
          description: Vehículo creado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehiculo" }
        "400": { description: "Datos inválidos (`vehiculo_invalido`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }
        "409": { description: "La patente ya existe (`patente_en_uso`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /vehiculos/{id}:
    put:
      tags: [flota]
      summary: Editar modelo, tipo, capacidades y estado de un vehículo (la patente no cambia)
      operationId: actualizarVehiculo
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehiculoRequest" }
      responses:
        "200":
          description: Vehículo actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehiculo" }
        "400": { description: "Datos inválidos (`vehiculo_invalido`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }
        "404": { description: "No existe (`no_encontrado`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      tags: [flota]
      summary: Eliminar un vehículo (borrado físico)
      description: Solo admin. Bloqueado (423 `vehiculo_en_uso`) si tiene una ruta planificada o en curso.
      operationId: eliminarVehiculo
      x-required-role: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Eliminado. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }
        "404": { description: "No existe (`no_encontrado`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "423": { description: "Tiene una ruta planificada o en curso (`vehiculo_en_uso`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /rutas/{id}/vehiculo:
    put:
      tags: [flota, rutas]
      summary: Asignar (o quitar) el vehículo de una ruta (HU-18)
      operationId: asignarVehiculoRuta
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vehiculo_id: { type: string, description: "Vacío = quitar el vehículo." }
      responses:
        "204": { description: Asignado. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }
        "404": { description: "La ruta o el vehículo no existen (`no_encontrado`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "El vehículo está en mantenimiento (`vehiculo_no_disponible`) o ya tiene otra ruta ese día (`vehiculo_ocupado`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /envios/{id}/trayecto:
    get:
      tags: [flota, envios]
      summary: Camino por calles desde el vehículo hasta el destino del envío (HU-12)
      description: |
        `recorrido` se calcula si el envío está asignado o en camino, su ruta tiene
        vehículo y el destino está geolocalizado. **Roles: todos; el repartidor solo
        ve envíos de sus rutas (ajeno = 404).**
      operationId: trayectoEnvio
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Trayecto.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrayectoEnvio" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "404": { description: "No existe o no es del repartidor (`no_encontrado`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /envios/{id}/avisos:
    get:
      tags: [whatsapp, envios]
      summary: Avisos de WhatsApp enviados al destinatario del envío (HU-17)
      operationId: avisosEnvio
      x-required-role: [operador, admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Avisos, más nuevos primero.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvisoWhatsapp" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }

  /auth/login/verificar:
    post:
      tags: [auth, whatsapp]
      summary: Segundo paso del login - código de 6 dígitos recibido por WhatsApp (HU-16)
      description: |
        Cuando `POST /auth/login` responde `requiere_codigo: true`, la app pide el
        código que llegó por WhatsApp y lo canjea acá por el JWT. El código vence a
        los `OTP_TTL_MIN` minutos (10), admite `OTP_MAX_INTENTOS` intentos (3) y es
        de un solo uso.
      operationId: verificarCodigoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desafio_id, codigo]
              properties:
                desafio_id: { type: string }
                codigo: { type: string, example: "123456" }
      responses:
        "200":
          description: Sesión iniciada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { description: "Código incorrecto (`codigo_invalido`) o vencido, usado o sin intentos (`codigo_vencido`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /auth/login/reenviar:
    post:
      tags: [auth, whatsapp]
      summary: Reenviar el código de verificación (invalida el anterior)
      operationId: reenviarCodigoLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desafio_id]
              properties:
                desafio_id: { type: string }
      responses:
        "200":
          description: Código nuevo enviado; devuelve el desafío nuevo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DesafioLogin" }
        "401": { description: "El desafío no existe o venció (`codigo_invalido`): volver a ingresar la contraseña.", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "429": { description: "Menos de un minuto desde el último código (`esperar_reenvio`) o más de 3 en 15 minutos (`demasiados_pedidos`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /users/{id}/telefono:
    put:
      tags: [auth, whatsapp]
      summary: Cargar o quitar el celular de un usuario (HU-16)
      description: Se normaliza a formato internacional (549 + área + número). Vacío = quitar. **Rol admin.**
      operationId: actualizarTelefono
      x-required-role: [admin]
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { telefono: { type: string } } }
      responses:
        "200":
          description: Teléfono guardado.
          content:
            application/json:
              schema: { type: object, properties: { telefono: { type: string } } }
        "400": { description: "Teléfono inválido (`telefono_invalido`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }
        "404": { description: "Usuario inexistente (`no_encontrado`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "Otro usuario ya tiene ese teléfono (`telefono_en_uso`).", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /admin/whatsapp/estado:
    get:
      tags: [whatsapp]
      summary: Estado de la cuenta de WhatsApp vinculada y QR para vincular (HU-16/17)
      description: Si no está vinculada, inicia la vinculación y devuelve el QR (se renueva cada ~20 s). **Rol admin.**
      operationId: estadoWhatsapp
      x-required-role: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Estado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EstadoWhatsapp" }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }

  /admin/whatsapp/desvincular:
    post:
      tags: [whatsapp]
      summary: Cerrar la sesión de WhatsApp en el servidor
      operationId: desvincularWhatsapp
      x-required-role: [admin]
      security:
        - bearerAuth: []
      responses:
        "204": { description: Desvinculado. }
        "401": { $ref: "#/components/responses/NoAutenticado" }
        "403": { $ref: "#/components/responses/RolNoAutorizado" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT firmado con HS256, obtenido en `POST /auth/login`. Se envía como
        `Authorization: Bearer <token>`. El middleware exige explícitamente
        el algoritmo HS256 (rechaza tokens firmados con otro algoritmo).

  responses:
    NoAutenticado:
      description: >
        Falta el header `Authorization` (`sin_token`) o el token es
        inválido/expiró (`token_invalido`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          examples:
            sin_token:
              value:
                error:
                  code: sin_token
                  message: falta el header Authorization
            token_invalido:
              value:
                error:
                  code: token_invalido
                  message: el token es inválido o expiró
    RolNoAutorizado:
      description: El rol del usuario autenticado no tiene permisos para esta acción (`rol_no_autorizado`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: rol_no_autorizado
              message: no tenés permisos para esta acción
    ErrorInterno:
      description: Error inesperado del servidor (`error_interno`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: error_interno
              message: no se pudo completar la operación

  schemas:
    ApiError:
      type: object
      description: Formato estándar de error de la API.
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Código corto y estable del error.
              example: no_encontrado
            message:
              type: string
              description: Mensaje legible para mostrar o loguear.
              example: el recurso no existe
          required: [code, message]
      required: [error]

    Rol:
      type: string
      description: Rol del usuario.
      enum: [operador, repartidor, admin]

    EstadoEnvio:
      type: string
      description: Estado del ciclo de vida de un envío.
      enum: [pendiente, asignado, en_camino, entregado, no_entregado]

    EstadoRuta:
      type: string
      description: Estado del ciclo de vida de una ruta.
      enum: [planificada, en_curso, completada]

    Tamano:
      type: string
      description: Tamaño del paquete.
      enum: [chico, mediano, grande]

    # ---- Auth ----
    RegisterRequest:
      type: object
      properties:
        telefono:
          type: string
          description: Celular en formato internacional sin "+" (5493564412345); opcional (Sprint 3, HU-16).
        nombre:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        rol:
          $ref: "#/components/schemas/Rol"
      required: [nombre, email, password, rol]

    UsuarioCreado:
      type: object
      description: Usuario recién registrado. No incluye la contraseña ni su hash.
      properties:
        id:
          type: string
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          $ref: "#/components/schemas/Rol"
      required: [id, nombre, email, rol]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado con HS256, válido por 24 horas.
      required: [token]

    # ---- Usuarios ----
    Usuario:
      type: object
      description: Usuario del sistema, tal como lo devuelve GET /users.
      properties:
        telefono:
          type: string
          description: Celular en formato internacional sin "+" (5493564412345); opcional (Sprint 3, HU-16).
        id:
          type: string
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          $ref: "#/components/schemas/Rol"
        activo:
          type: boolean
      required: [id, nombre, email, rol, activo]

    RepartidorOption:
      type: object
      description: Versión mínima de un repartidor, usada para selección en formularios.
      properties:
        id:
          type: string
        nombre:
          type: string
      required: [id, nombre]

    # ---- Envíos ----
    Remitente:
      type: object
      properties:
        nombre:
          type: string
        telefono:
          type: string
        direccion:
          type: string
      required: [nombre, telefono, direccion]

    Destinatario:
      type: object
      properties:
        nombre:
          type: string
        telefono:
          type: string
        calle:
          type: string
        numero:
          type: string
        piso_depto:
          type: string
        localidad:
          type: string
        codigo_postal:
          type: string
      required: [nombre, telefono, calle, numero, piso_depto, localidad, codigo_postal]

    DestinatarioConId:
      description: Destinatario tal como se devuelve embebido en un envío (incluye id).
      allOf:
        - type: object
          properties:
            id:
              type: string
        - $ref: "#/components/schemas/Destinatario"

    Paquete:
      type: object
      properties:
        peso:
          type: number
          format: double
          description: Peso en kilogramos.
        tamano:
          $ref: "#/components/schemas/Tamano"
        tipo_contenido:
          type: string
        fragil:
          type: boolean
        urgente:
          type: boolean
      required: [peso, tamano, tipo_contenido, fragil, urgente]

    CrearEnvioRequest:
      type: object
      properties:
        remitente:
          $ref: "#/components/schemas/Remitente"
        destinatario:
          $ref: "#/components/schemas/Destinatario"
        paquete:
          $ref: "#/components/schemas/Paquete"
      required: [remitente, destinatario, paquete]

    EnvioCreado:
      type: object
      description: Respuesta de POST /envios (no es el Envio completo).
      properties:
        id:
          type: string
        codigo_guia:
          type: string
          example: MOV-20260909-0001
        estado:
          $ref: "#/components/schemas/EstadoEnvio"
        peso:
          type: number
          format: double
        tamano:
          $ref: "#/components/schemas/Tamano"
      required: [id, codigo_guia, estado, peso, tamano]

    Envio:
      type: object
      description: Envío completo, tal como aparece embebido en el detalle de una ruta.
      properties:
        id:
          type: string
        codigo_guia:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoEnvio"
        peso:
          type: number
          format: double
        tamano:
          $ref: "#/components/schemas/Tamano"
        tipo_contenido:
          type: string
        fragil:
          type: boolean
        urgente:
          type: boolean
        remitente_id:
          type: string
        destinatario_id:
          type: string
        ruta_id:
          type: string
          nullable: true
          description: null si el envío todavía no fue asignado a una ruta.
      required:
        - id
        - codigo_guia
        - estado
        - peso
        - tamano
        - tipo_contenido
        - fragil
        - urgente
        - remitente_id
        - destinatario_id
        - ruta_id

    EnvioConDetalle:
      description: Respuesta de GET /envios/{id}. Agrega el destinatario y la fecha de creación al envío.
      allOf:
        - $ref: "#/components/schemas/Envio"
        - type: object
          properties:
            destinatario:
              $ref: "#/components/schemas/DestinatarioConId"
            fecha_creacion:
              type: string
          required: [destinatario, fecha_creacion]

    EnvioListItem:
      type: object
      description: Item de la respuesta de GET /envios (forma reducida, no el Envio completo).
      properties:
        id:
          type: string
        codigo_guia:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoEnvio"
        peso:
          type: number
          format: double
        tamano:
          $ref: "#/components/schemas/Tamano"
        destinatario:
          type: string
          description: Nombre del destinatario.
        direccion:
          type: string
          description: "Dirección armada como \"calle numero, localidad\"."
        fecha_creacion:
          type: string
        ruta_id:
          type: string
          nullable: true
          description: null si el envío todavía no fue asignado a una ruta.
      required:
        - id
        - codigo_guia
        - estado
        - peso
        - tamano
        - destinatario
        - direccion
        - fecha_creacion
        - ruta_id

    # ---- Rutas ----
    RutaRequest:
      type: object
      properties:
        nombre:
          type: string
        zona:
          type: string
        fecha:
          type: string
          description: Formato YYYY-MM-DD.
          example: "2026-09-09"
        repartidor_id:
          type: string
      required: [nombre, zona, fecha, repartidor_id]

    Ruta:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        zona:
          type: string
        fecha:
          type: string
          description: Formato YYYY-MM-DD.
        estado:
          $ref: "#/components/schemas/EstadoRuta"
        repartidor_id:
          type: string
      required: [id, nombre, zona, fecha, estado, repartidor_id]

    RutaConConteo:
      description: Ruta con la cantidad de envíos asignados, tal como aparece en GET /rutas.
      allOf:
        - $ref: "#/components/schemas/Ruta"
        - type: object
          properties:
            cantidad_envios:
              type: integer
          required: [cantidad_envios]

    RutaDetalle:
      type: object
      description: Respuesta de GET /rutas/{id}.
      properties:
        id:
          type: string
        nombre:
          type: string
        zona:
          type: string
        fecha:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoRuta"
        repartidor_id:
          type: string
        envios:
          type: array
          items:
            $ref: "#/components/schemas/Envio"
        peso_total:
          type: number
          format: double
        cantidad_envios:
          type: integer
      required:
        - id
        - nombre
        - zona
        - fecha
        - estado
        - repartidor_id
        - envios
        - peso_total
        - cantidad_envios

    AsignarEnviosRequest:
      type: object
      properties:
        envio_ids:
          type: array
          items:
            type: string
      required: [envio_ids]

    AsignarEnviosResponse:
      type: object
      properties:
        asignados:
          type: integer
          description: Cantidad de envíos que quedaron efectivamente asignados.
      required: [asignados]

    # ---- Repartidor ----
    EnvioDelDia:
      description: Envío en el contexto del listado del repartidor (incluye destinatario y nombre de ruta).
      allOf:
        - $ref: "#/components/schemas/Envio"
        - type: object
          properties:
            destinatario:
              $ref: "#/components/schemas/DestinatarioConId"
            remitente:
              type: object
              properties:
                id: {type: string}
                nombre: {type: string}
                telefono: {type: string}
                direccion: {type: string}
            ruta_nombre:
              type: string
          required: [destinatario, ruta_nombre]

    RutaConEnviosDelDia:
      type: object
      properties:
        ruta_id:
          type: string
          description: Cadena vacía si el envío está en la lista sin ruta asignada.
        ruta_nombre:
          type: string
        envios:
          type: array
          items:
            $ref: "#/components/schemas/EnvioDelDia"
      required: [ruta_id, ruta_nombre, envios]

    ResumenDelDia:
      type: object
      description: Respuesta de GET /repartidor/envios-del-dia.
      properties:
        fecha:
          type: string
          description: Fecha de hoy en UTC, formato YYYY-MM-DD.
        rutas:
          type: array
          items:
            $ref: "#/components/schemas/RutaConEnviosDelDia"
        total:
          type: integer
        pendientes:
          type: integer
        asignados:
          type: integer
        en_camino:
          type: integer
        entregados:
          type: integer
        no_entregados:
          type: integer
      required:
        - fecha
        - rutas
        - total
        - pendientes
        - asignados
        - en_camino
        - entregados
        - no_entregados

    # ---- Sprint 2: seguimiento (HU-06 a HU-10) ----
    MotivoFallo:
      type: string
      description: Lista cerrada de motivos de entrega fallida (HU-07).
      enum: [cliente_ausente, direccion_incorrecta, rechazado, zona_insegura, otro]

    FranjaHoraria:
      type: string
      description: Franja para reprogramación (HU-09).
      enum: [manana, tarde, noche]

    RelacionReceptor:
      type: string
      description: Relación de quien recibe con el destinatario (HU-08).
      enum: [destinatario, familiar, vecino, encargado]

    CambiarEstadoRequest:
      type: object
      properties:
        estado:
          type: string
          description: Solo `asignado` o `en_camino` (el resto va por sus endpoints).
          enum: [asignado, en_camino]
      required: [estado]

    IncidenciaRequest:
      type: object
      properties:
        motivo:
          $ref: "#/components/schemas/MotivoFallo"
        comentario:
          type: string
          description: Libre; obligatorio si el motivo es `otro`.
        foto_base64:
          type: string
          description: Opcional. Foto JPEG en base64, máximo 5 MB decodificada.
      required: [motivo]

    ConfirmacionRequest:
      type: object
      properties:
        receptor_nombre:
          type: string
        receptor_relacion:
          $ref: "#/components/schemas/RelacionReceptor"
        firma_base64:
          type: string
          description: Firma PNG en base64, máximo 5 MB decodificada.
        foto_base64:
          type: string
          description: Foto JPEG del paquete en base64, máximo 5 MB decodificada.
      required: [receptor_nombre, receptor_relacion, firma_base64, foto_base64]

    ReprogramacionRequest:
      type: object
      properties:
        nueva_fecha:
          type: string
          description: Fecha futura o de hoy, formato YYYY-MM-DD.
          example: "2026-09-20"
        franja:
          $ref: "#/components/schemas/FranjaHoraria"
      required: [nueva_fecha, franja]

    EventoEnvio:
      type: object
      description: Una fila del historial del envío (tabla eventos_envio).
      properties:
        id:
          type: string
        fecha:
          type: string
          example: "2026-09-09T15:40:00Z"
        actor_nombre:
          type: string
          nullable: true
          description: Quien hizo el cambio; null en el backfill o si el usuario se dio de baja.
        estado_anterior:
          type: string
          nullable: true
          description: Null en el evento raíz.
        estado_nuevo:
          type: string
        motivo:
          $ref: "#/components/schemas/MotivoFallo"
        comentario:
          type: string
          nullable: true
        tiene_foto:
          type: boolean
          description: True si el evento tiene foto (incidencias HU-07); se descarga por GET /envios/{id}/eventos/{eventoId}/foto.
      required: [fecha, estado_nuevo]

    ConfirmacionMetadata:
      type: object
      description: Evidencia de entrega sin los bytes (van por URLs binarias).
      properties:
        receptor_nombre:
          type: string
        receptor_relacion:
          $ref: "#/components/schemas/RelacionReceptor"
        confirmada_at:
          type: string
        firma_url:
          type: string
          example: /envios/1a2b3c4d/confirmacion/firma
        foto_url:
          type: string
          example: /envios/1a2b3c4d/confirmacion/foto
      required: [receptor_nombre, receptor_relacion, confirmada_at, firma_url, foto_url]

    EnvioDetalle:
      description: Detalle extendido Sprint 2 (aditivo sobre EnvioConDetalle).
      allOf:
        - $ref: "#/components/schemas/EnvioConDetalle"
        - type: object
          properties:
            reprogramado_para:
              type: string
              nullable: true
              description: Fecha comprometida (formato YYYY-MM-DD), solo si se reprogramó y aún no se asignó a una ruta.
            franja:
              $ref: "#/components/schemas/FranjaHoraria"
            historial:
              type: array
              items:
                $ref: "#/components/schemas/EventoEnvio"
            confirmacion:
              $ref: "#/components/schemas/ConfirmacionMetadata"
          required: [historial]

    TrackingEvento:
      type: object
      description: Evento legible para el cliente final (sin datos internos).
      properties:
        fecha:
          type: string
        descripcion:
          type: string
          example: "No se pudo entregar: cliente ausente"
        motivo:
          $ref: "#/components/schemas/MotivoFallo"
      required: [fecha, descripcion]

    TrackingResponse:
      type: object
      description: Respuesta de GET /tracking/{codigo}. Solo columnas blancas.
      properties:
        codigo_guia:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoEnvio"
        localidad:
          type: string
        actualizado_en:
          type: string
        historial:
          type: array
          items:
            $ref: "#/components/schemas/TrackingEvento"
        fecha_entrega:
          type: string
          format: date
        franja:
          type: string
          enum: [manana, tarde, noche]
        entregado_en:
          type: string
          format: date-time
        paquete:
          type: object
          properties:
            peso: { type: number }
            tamano: { type: string }
            fragil: { type: boolean }
            urgente: { type: boolean }
        en_vivo:
          type: object
          description: |
            Solo el día de entrega y mientras el envío está asignado o en camino.
            El destino va redondeado (~100 m) y el recorrido se corta a 150 m del
            destino para no revelar la dirección; la patente va parcial.
          properties:
            vehiculo:
              type: object
              properties:
                tipo: { type: string }
                modelo: { type: string }
                color: { type: string }
                patente: { type: string, example: "AB•••CD" }
                lat: { type: number }
                lng: { type: number }
                rumbo: { type: number }
                velocidad: { type: number }
                en: { type: string, format: date-time }
            destino:
              type: object
              nullable: true
              properties:
                lat: { type: number }
                lng: { type: number }
            recorrido:
              type: object
              nullable: true
            paradas_antes: { type: integer }
            eta_desde: { type: string, format: date-time }
            eta_hasta: { type: string, format: date-time }
            eta_minutos: { type: integer }
      required: [codigo_guia, estado, localidad, actualizado_en, historial]

    PerfilRepartidor:
      type: object
      properties:
        nombre: { type: string }
        email: { type: string }
        telefono: { type: string, description: "Enmascarado: ••••45" }
        rol: { type: string }
        miembro_desde: { type: string, format: date }
        con_google: { type: boolean }
        historico:
          type: object
          properties:
            entregados: { type: integer }
            no_entregados: { type: integer }
            efectividad: { type: number }
            kg_entregados: { type: number }
            rutas_completadas: { type: integer }
            dias_trabajados: { type: integer }
            promedio_por_dia: { type: number }
            mejor_dia: { type: integer }
            fragiles_entregados: { type: integer }
        ultimos_dias:
          type: array
          items:
            type: object
            properties:
              fecha: { type: string, format: date }
              entregados: { type: integer }
              no_entregados: { type: integer }
        motivos_fallo:
          type: array
          items:
            type: object
            properties:
              motivo: { type: string }
              cantidad: { type: integer }
        vehiculo_hoy:
          type: object
          nullable: true
        rutas_hoy: { type: integer }
        primera_entrega_hoy: { type: string, format: date-time }
        ultima_entrega_hoy: { type: string, format: date-time }

    # ---- Sprint 3: analítica y mapas (HU-11 a HU-15) ----
    MetricasDia:
      type: object
      description: Contadores del panel de operaciones.
      properties:
        total_envios:
          type: integer
        pendientes:
          type: integer
        asignados:
          type: integer
        en_camino:
          type: integer
        entregados:
          type: integer
        no_entregados:
          type: integer
        porcentaje_efectividad:
          type: number
          format: double
          description: entregados / (entregados + no_entregados) * 100, 2 decimales; 0 si no hay intentos resueltos.
      required: [total_envios, pendientes, asignados, en_camino, entregados, no_entregados, porcentaje_efectividad]

    RutaActiva:
      type: object
      description: Avance de una ruta del día.
      properties:
        ruta_id:
          type: string
        nombre:
          type: string
        repartidor_nombre:
          type: string
        total_paradas:
          type: integer
        completadas:
          type: integer
          description: Entregadas + no entregadas.
        porcentaje_avance:
          type: number
          format: double
        estado_ruta:
          $ref: "#/components/schemas/EstadoRuta"
      required: [ruta_id, nombre, repartidor_nombre, total_paradas, completadas, porcentaje_avance, estado_ruta]

    Alerta:
      type: object
      description: Incidencia reciente del día.
      properties:
        envio_id:
          type: string
        codigo_guia:
          type: string
        tipo:
          type: string
        descripcion:
          type: string
        fecha:
          type: string
          example: "2026-09-09T15:40:00Z"
      required: [envio_id, codigo_guia, tipo, descripcion, fecha]

    DashboardOperaciones:
      type: object
      description: Respuesta de GET /operaciones/dashboard.
      properties:
        fecha:
          type: string
          description: Fecha consultada, formato YYYY-MM-DD.
        metricas:
          $ref: "#/components/schemas/MetricasDia"
        rutas_activas:
          type: array
          items:
            $ref: "#/components/schemas/RutaActiva"
        ultimas_alertas:
          type: array
          description: Hasta 10 incidencias del día, las más nuevas primero.
          items:
            $ref: "#/components/schemas/Alerta"
      required: [fecha, metricas, rutas_activas, ultimas_alertas]

    Coordenadas:
      type: object
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
      required: [lat, lng]

    ParadaMapa:
      type: object
      description: Envío de la ruta ubicado en el mapa.
      properties:
        orden:
          type: integer
        envio_id:
          type: string
        codigo_guia:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoEnvio"
        destinatario_nombre:
          type: string
        direccion:
          type: string
        localidad:
          type: string
        coordenadas:
          type: object
          allOf:
            - $ref: "#/components/schemas/Coordenadas"
          nullable: true
          description: null si el destino todavía no está geolocalizado.
      required: [orden, envio_id, codigo_guia, estado, destinatario_nombre, direccion, localidad, coordenadas]

    RepartidorRef:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
      required: [id, nombre]

    RutaMapa:
      type: object
      description: Respuesta de GET /rutas/{id}/mapa.
      properties:
        ruta_id:
          type: string
        nombre:
          type: string
        fecha:
          type: string
          description: Formato YYYY-MM-DD.
        repartidor:
          $ref: "#/components/schemas/RepartidorRef"
        paradas:
          type: array
          items:
            $ref: "#/components/schemas/ParadaMapa"
        vehiculo:
          allOf: [{ $ref: "#/components/schemas/PosicionVehiculo" }]
          nullable: true
          description: Vehículo asignado con su última posición (Sprint 3, HU-18).
        recorrido:
          allOf: [{ $ref: "#/components/schemas/Recorrido" }]
          nullable: true
          description: Recorrido por calles depósito → paradas.
        deposito:
          $ref: "#/components/schemas/Coordenadas"
      required: [ruta_id, nombre, fecha, repartidor, paradas]

    Periodo:
      type: object
      description: Rango de fechas del reporte, ambos extremos inclusive (UTC).
      properties:
        desde:
          type: string
          description: Formato YYYY-MM-DD.
        hasta:
          type: string
          description: Formato YYYY-MM-DD.
      required: [desde, hasta]

    FilaReporteEnvio:
      type: object
      properties:
        codigo_guia:
          type: string
        fecha_creacion:
          type: string
        remitente:
          type: string
        destinatario:
          type: string
        direccion:
          type: string
        localidad:
          type: string
        estado:
          $ref: "#/components/schemas/EstadoEnvio"
        ultima_actualizacion:
          type: string
        motivo_fallo:
          type: string
          nullable: true
          description: Motivo de la última incidencia; null si nunca falló.
      required: [codigo_guia, fecha_creacion, remitente, destinatario, direccion, localidad, estado, ultima_actualizacion, motivo_fallo]

    ReporteEnvios:
      type: object
      description: Respuesta JSON de GET /reportes/envios.
      properties:
        periodo:
          $ref: "#/components/schemas/Periodo"
        total:
          type: integer
        envios:
          type: array
          items:
            $ref: "#/components/schemas/FilaReporteEnvio"
      required: [periodo, total, envios]

    DesempenoRepartidor:
      type: object
      properties:
        posicion:
          type: integer
        repartidor_id:
          type: string
        nombre:
          type: string
        asignados:
          type: integer
          description: Entregados + fallidos + envíos aún en curso en sus rutas del período.
        entregados:
          type: integer
          description: Eventos registrados por el propio repartidor en el período.
        fallidos:
          type: integer
          description: Eventos registrados por el propio repartidor en el período.
        tasa_efectividad:
          type: number
          format: double
          description: Porcentaje con 2 decimales.
        promedio_minutos_entrega:
          type: number
          format: double
          nullable: true
          description: >
            Minutos promedio entre en_camino y entregado, 1 decimal. Excluye
            la confirmación directa desde asignado; null si no hay entregas medibles.
      required: [posicion, repartidor_id, nombre, asignados, entregados, fallidos, tasa_efectividad, promedio_minutos_entrega]

    RankingRepartidores:
      type: object
      description: Respuesta de GET /reportes/repartidores.
      properties:
        periodo:
          $ref: "#/components/schemas/Periodo"
        ranking:
          type: array
          items:
            $ref: "#/components/schemas/DesempenoRepartidor"
      required: [periodo, ranking]

    MotivoIncidencia:
      type: object
      properties:
        motivo:
          $ref: "#/components/schemas/MotivoFallo"
        etiqueta:
          type: string
          example: Destinatario ausente
        cantidad:
          type: integer
        porcentaje:
          type: number
          format: double
          description: Porcentaje con 2 decimales.
      required: [motivo, etiqueta, cantidad, porcentaje]

    ReporteIncidencias:
      type: object
      description: Respuesta de GET /reportes/incidencias.
      properties:
        periodo:
          $ref: "#/components/schemas/Periodo"
        total_incidencias:
          type: integer
        distribucion:
          type: array
          description: Los 5 motivos siempre presentes, de mayor a menor cantidad.
          items:
            $ref: "#/components/schemas/MotivoIncidencia"
      required: [periodo, total_incidencias, distribucion]

    Vehiculo:
      type: object
      description: Vehículo con telemetría y la ruta/carga del día consultado.
      properties:
        id: { type: string }
        patente: { type: string, example: TRK-318 }
        modelo: { type: string }
        tipo: { type: string, enum: [camion, furgon, utilitario, moto] }
        capacidad_peso: { type: number, description: kg }
        capacidad_volumen: { type: number, description: m3 }
        estado: { type: string, enum: [activo, en_base, mantenimiento] }
        color: { type: string, example: "#f4b400", description: "Color propio #RRGGBB; vacío = automático." }
        latitud: { type: number }
        longitud: { type: number }
        velocidad: { type: number, description: km/h }
        rumbo: { type: number, description: "Grados, 0 = norte." }
        temperatura: { type: number, description: "Grados C de la caja." }
        posicion_at: { type: string, format: date-time }
        ruta_id: { type: string, nullable: true }
        ruta_nombre: { type: string }
        ruta_zona: { type: string }
        ruta_estado: { type: string }
        repartidor_id: { type: string, nullable: true }
        repartidor_nombre: { type: string }
        carga_actual_peso: { type: number, description: "kg de paquetes asignados o en camino." }
        capacidad_porcentaje: { type: number }
        total_paquetes: { type: integer }
        paquetes_entregados: { type: integer }
        paquetes_fallidos: { type: integer }

    VehiculoRequest:
      type: object
      required: [modelo, capacidad_peso, capacidad_volumen]
      properties:
        patente: { type: string, description: "Solo en el alta. Formatos AB123CD, ABC123 o internos (TRK-318)." }
        modelo: { type: string }
        tipo: { type: string, enum: [camion, furgon, utilitario, moto], default: camion }
        capacidad_peso: { type: number, description: "Mayor a 0." }
        capacidad_volumen: { type: number, description: "Mayor a 0." }
        estado: { type: string, enum: [activo, en_base, mantenimiento], default: en_base }
        color: { type: string, example: "#f4b400", description: "#RRGGBB; vacío = automático. Otro formato da 400 `vehiculo_invalido`." }

    PaqueteVehiculo:
      type: object
      properties:
        orden: { type: integer }
        envio_id: { type: string }
        codigo_guia: { type: string }
        estado: { $ref: "#/components/schemas/EstadoEnvio" }
        peso: { type: number }
        tamano: { type: string }
        tipo_contenido: { type: string }
        fragil: { type: boolean }
        urgente: { type: boolean }
        destinatario_nombre: { type: string }
        direccion: { type: string }
        localidad: { type: string }
        coordenadas:
          allOf: [{ $ref: "#/components/schemas/Coordenadas" }]
          nullable: true

    VehiculoDetalle:
      allOf:
        - $ref: "#/components/schemas/Vehiculo"
        - type: object
          properties:
            paquetes:
              type: array
              items: { $ref: "#/components/schemas/PaqueteVehiculo" }
            recorrido:
              allOf: [{ $ref: "#/components/schemas/Recorrido" }]
              nullable: true

    Recorrido:
      type: object
      description: Polilínea por calles (OSRM; en línea recta si el servicio no responde).
      properties:
        geometria:
          type: array
          description: "Puntos [lat, lng]."
          items:
            type: array
            items: { type: number }
        distancia_m: { type: number }
        duracion_s: { type: number }

    PosicionVehiculo:
      type: object
      properties:
        vehiculo_id: { type: string }
        patente: { type: string }
        ruta_id: { type: string, nullable: true }
        lat: { type: number }
        lng: { type: number }
        velocidad: { type: number }
        rumbo: { type: number }
        en: { type: string, format: date-time }

    TrayectoEnvio:
      type: object
      properties:
        envio_id: { type: string }
        codigo_guia: { type: string }
        estado: { $ref: "#/components/schemas/EstadoEnvio" }
        destino:
          allOf: [{ $ref: "#/components/schemas/Coordenadas" }]
          nullable: true
        direccion: { type: string }
        vehiculo:
          allOf: [{ $ref: "#/components/schemas/PosicionVehiculo" }]
          nullable: true
        recorrido:
          allOf: [{ $ref: "#/components/schemas/Recorrido" }]
          nullable: true
        paradas_antes: { type: integer, description: "Entregas pendientes de la ruta antes de esta." }

    AvisoWhatsapp:
      type: object
      properties:
        tipo: { type: string, enum: [envio_en_camino, envio_entregado, envio_no_entregado, envio_reprogramado, ruta_asignada] }
        estado: { type: string, enum: [pendiente, enviado, fallido, omitido] }
        mensaje: { type: string }
        error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    EstadoWhatsapp:
      type: object
      properties:
        habilitado: { type: boolean, description: "false = WHATSAPP_HABILITADO apagado (solo log)." }
        conectado: { type: boolean }
        vinculado: { type: boolean }
        numero: { type: string }
        qr: { type: string, description: Contenido del QR vigente. }
        qr_vence: { type: string, format: date-time }
        qr_imagen: { type: string, description: "QR listo para mostrar (data URL PNG)." }

    DesafioLogin:
      type: object
      description: Segundo paso pendiente del login (HU-16) o del primer acceso (T1).
      properties:
        requiere_codigo: { type: boolean, example: true }
        desafio_id: { type: string }
        telefono: { type: string, description: "Celular enmascarado (+54 9 3564 ••••45); vacío si el código fue por mail." }
        canal: { type: string, enum: [whatsapp, mail] }
        destino: { type: string, description: "Celular o mail enmascarado (a•••@movii.demo)." }
        vence_en_segundos: { type: integer, example: 600 }

    PrimerAccesoRequerido:
      type: object
      description: Respuesta 428 de POST /auth/login (T1).
      properties:
        code: { type: string, example: must_change_password }
        user_id: { type: string }
        token: { type: string, description: "Solo para /auth/primer-acceso/cambiar-password; vence a los 15 minutos." }
        error:
          type: object
          properties:
            code: { type: string, example: must_change_password }
            message: { type: string }
