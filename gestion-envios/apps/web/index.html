<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: la página llega hasta el notch y la barra de inicio;
         los márgenes los ponen las safe areas (env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color de las barras del navegador; lo actualiza useBordesNavegador() según la pantalla. -->
    <meta name="theme-color" content="#1a1a1a" />
    <!-- El panel tiene su propio modo claro/oscuro (botón al pie del menú): que el navegador o una
         extensión de modo oscuro no lo vuelvan a oscurecer por su cuenta. -->
    <meta name="color-scheme" content="light" />
    <meta name="darkreader-lock" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"
      rel="stylesheet"
    />
    <title>Movii — Panel de operaciones</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
